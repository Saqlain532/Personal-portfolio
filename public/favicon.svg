<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 256 256"
  width="256"
  height="256"
  fill="none"
>
  
  <defs>

    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#003D82"/>
    </linearGradient>

    <!-- S Gradient -->
    <linearGradient id="sGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->
  <rect
    x="16"
    y="16"
    width="224"
    height="224"
    rx="52"
    fill="url(#bg)"
  />

  <!-- Tech Lines -->
  <path
    d="M45 65 H95"
    stroke="#38BDF8"
    stroke-width="4"
    opacity="0.5"
  />

  <path
    d="M160 190 H210"
    stroke="#38BDF8"
    stroke-width="4"
    opacity="0.5"
  />

  <path
    d="M195 45 V90"
    stroke="#38BDF8"
    stroke-width="4"
    opacity="0.4"
  />

  <!-- Italic Techy S -->
  <path
    d="
      M170 70
      C150 45 100 50 82 74
      C67 94 82 112 124 122
      C162 131 176 145 166 167
      C154 192 104 198 72 174
    "
    stroke="url(#sGradient)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
    transform="skewX(-12)"
  />

  <!-- Accent Dot -->
  <circle
    cx="185"
    cy="68"
    r="8"
    fill="#67E8F9"
    opacity="0.9"
  />

</svg>